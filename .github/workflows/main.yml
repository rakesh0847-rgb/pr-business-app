name: Build PR Lifts APK
'on': [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.prlifts pr_business
      - run: cp lib/main_fixed_updated.dart pr_business/lib/main.dart
      - run: cp lib/gst_invoice.dart pr_business/lib/gst_invoice.dart
      - run: cd pr_business && flutter pub add shared_preferences pdf printing intl
      - run: cd pr_business && flutter pub get
      - run: cd pr_business && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PR-Lifts-APK
          path: pr_business/build/app/outputs/flutter-apk/app-release.apk
