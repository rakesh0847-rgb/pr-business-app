name: Build PR Business APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create --platforms=android --org com.prbusiness pr_business

      - run: cd pr_business && flutter pub get

      - run: cd pr_business && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PR-Business-APK
          path: pr_business/build/app/outputs/flutter-apk/app-release.apk
